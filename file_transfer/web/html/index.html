<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>文件传输</title>
    <link rel="stylesheet" href="../css/styles.css">
    <link rel="icon" type="image/x-icon" href="../images/favicon.ico">
</head>
<body>
    <div class="container">
        <!-- 📤 文件上传 -->
        <div class="upload-form">
            <h2>上传文件</h2>
            <div id="drop-zone">
                <span id="drop-zone-text">点击此处选择上传文件/文件夹，</br>或直接拖拽文件/文件夹进行上传</span>
                <div class="file-selection-buttons" style="display: none;">
                    <button type="button" id="select-files-btn">选择文件</button>
                    <button type="button" id="select-folder-btn">选择文件夹</button>
                </div>
                <input type="file" id="file-input" multiple style="display: none;">
                <input type="file" id="folder-input" webkitdirectory multiple style="display: none;">
            </div>
            <form id="upload-form" method="post" action="/upload" enctype="multipart/form-data">
                <label for="target_folder">选择目标文件夹：</label>
                <select id="target_folder" name="target_folder">
                    <option value="">默认上传目录</option>
                    {% for folder in subfolders %}
                        <option value="{{ folder }}">{{ folder }}</option>
                    {% endfor %}
                </select>
                <input type="submit" value="上传">
            </br>
                <button type="button" id="cancel-all-btn">清空全部上传区文件</button>
            </form>
            <div id="progress-container">
                <div id="progress-bar">0%</div>
            </div>
        </div>

        <!-- 📂 文件列表 -->
        <div class="file-list">
            <h1>文件列表</h1>
            <p>当前路径: /{{ current_path }}</p>
            <div class="user-controls">
                {% if session.get('logged_in') %}
                    <span>当前用户: {{ session.get('username') }}</span>
                    <a href="/logout" class="logout-btn">登出</a>
                {% endif %}
            </div>
            <ul>
                {% for item in items %}
                    <li>
                        {% if item.is_dir %}
                            <a href="/files/{{ item.path }}">{{ item.name }}/</a>
                        {% else %}
                            <a href="/download/{{ item.path }}" target="_blank">{{ item.name }}</a>
                        {% endif %}
                    </li>
                {% endfor %}
            </ul>
        </div>
    </div>

    <script src="../js/script.js"></script>
</body>
</html>
<input type="file" id="file-input" multiple style="display: none;">
<input type="file" id="folder-input" webkitdirectory multiple style="display: none;">
